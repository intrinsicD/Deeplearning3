# MMWM + MiraData training config (text-rich video generation data)
model:
  vector_dim: 32
  action_dim: 8
  image_size: 64
  audio_mel_bins: 80
  audio_mel_frames: 128
  text_len: 128
  vocab_size: 256

training:
  batch_size: 8
  total_steps: 100000
  lr: 2.0e-4
  grad_clip: 1.0
  warmup_fraction: 0.05
  mixed_precision: true
  run_dir: runs/mmwm_miradata

dataset:
  name: miradata
  split: train
  caption_level: medium
  n_frames: 2
  resolution: 64
  audio_sr: 16000
  audio_duration_s: 4.0

adapter:
  include_text: true
  include_image: true
  include_audio: false

