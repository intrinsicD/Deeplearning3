[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "omnilatent"
version = "0.1.0"
description = "OmniLatent: All-to-all multimodal AI with Latent Neural Hooks"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.1.0",
    "einops>=0.7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
coco = [
    "torchvision>=0.16.0",
    "Pillow>=9.0",
]
audio = [
    "torchaudio>=2.1.0",
]
video = [
    "torchaudio>=2.1.0",
    "torchvision>=0.16.0",
]
pdf = [
    "PyMuPDF>=1.23.0",
]
datasets = [
    "gymnasium>=0.29.0",
    "minari>=0.5.0",
    "huggingface_hub>=0.23.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.28.0",
]
all = [
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "Pillow>=9.0",
    "PyMuPDF>=1.23.0",
    "gymnasium>=0.29.0",
    "minari>=0.5.0",
    "huggingface_hub>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.28.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
omnilatent-train = "scripts.training.train:main"
omnilatent-train-coco = "scripts.training.train_coco:main"
omnilatent-train-pc = "scripts.training.train_pc:main"
omnilatent-auto-train = "scripts.training.auto_train:main"
omnilatent-curriculum-train = "scripts.training.curriculum_train:main"
omnilatent-evaluate = "scripts.evaluation.evaluate:main"
omnilatent-benchmark = "scripts.evaluation.benchmark:main"
omnilatent-demo = "scripts.evaluation.demo:main"
omnilatent-mmwm-usecase = "scripts.evaluation.mmwm_usecase:main"
omnilatent-diagnostics = "scripts.diagnostics.check_training_startup:main"
omnilatent-server = "apps.control_center.server:main"
mmwm-train-minari = "scripts.training.train_mmwm_minari:main"
mmwm-train-av = "scripts.training.train_mmwm_av:main"
hpwm-train = "scripts.training.train_hpwm:main"
lgq-train = "scripts.training.train_lgq:main"
gaussian-encoder-train = "scripts.training.train_gaussian_encoder:main"

[tool.setuptools.packages.find]
include = ["omnilatent*", "lgq*", "hpwm*", "MMWM*", "datasets*", "scripts*", "apps*", "gaussian_encoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
